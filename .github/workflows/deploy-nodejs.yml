name: Build and Deploy Node.js Express Backend

on:
  push:
    branches:
      - qas
      - master

env:
  NODE_VERSION: 22.12.0
  APP_NAME: ecredit-v2-services
  SERVICE_NAME: ${{ github.ref == 'refs/heads/master' && 'node-app-ecredit-v2-prd' || 'node-app-ecredit-v2-qas' }}
  DEPLOYE_PATH: D:\web_is\Services\iisnode\ecredit-v2-services\${{ github.ref == 'refs/heads/master' && 'PRD' || 'QAS' }}\

jobs:
  build-and-deploy:
    runs-on: [self-hosted, ecredit-v2-services]
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Copy source code to deploy path
        shell: powershell
        run: |
          robocopy . "${{ env.DEPLOYE_PATH }}" /E /XD .git node_modules logs /XF .env .env.dev .env.qas .env.prd web.config
          if ($LASTEXITCODE -le 7) {
            Write-Host "Robocopy completed with acceptable exit code: $LASTEXITCODE"
            exit 0
          } else {
            Write-Error "Robocopy failed with exit code: $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Install dependencies
        working-directory: ${{ env.DEPLOYE_PATH }}
        run: npm install

      - name: Stop service before startup check
        run: |
          nssm stop $env:SERVICE_NAME
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to stop service $env:SERVICE_NAME"
          }

      - name: Run basic test
        working-directory: ${{ env.DEPLOYE_PATH }}
        env:
          STARTUP_CHECK_ONLY: 'true'
        run: npm run start:${{ github.ref == 'refs/heads/master' && 'prd' || 'qas' }}

      - name: Start service via NSSM
        if: success()
        env:
          NODE_ENV: ${{ github.ref == 'refs/heads/master' && 'prd' || 'qas' }}
        run: |
          nssm set $env:SERVICE_NAME AppEnvironmentExtra "NODE_ENV=$env:NODE_ENV"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to set NODE_ENV for service $env:SERVICE_NAME"
          }

          nssm start $env:SERVICE_NAME
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to start service $env:SERVICE_NAME"
          }
